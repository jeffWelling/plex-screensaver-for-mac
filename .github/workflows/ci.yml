name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: macOS ${{ matrix.os }} build and tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Unit and fixture tests with complete concurrency checking
        run: make test
      - name: Build universal Release screensaver
        run: make build validate
      - name: Build development app
        run: make build SCHEME=SaverTest CONFIG=Debug
      - name: Package validated unsigned artifact
        if: matrix.os == 'macos-26'
        run: |
          mkdir -p build/release
          ditto build/xcode/Build/Products/Release/PlexSaver.saver build/release/Montage.saver
          ditto -c -k --sequesterRsrc --keepParent build/release/Montage.saver build/release/Montage.saver.zip
      - name: Save Release artifact
        if: matrix.os == 'macos-26'
        uses: actions/upload-artifact@v4
        with:
          name: Montage-universal-unsigned
          path: build/release/Montage.saver.zip
          if-no-files-found: error
